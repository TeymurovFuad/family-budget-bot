<table id="txn-table">
  <thead>
    <tr><th>Date</th><th class="num">Value</th><th>Category</th><th>Person</th><th>Description</th></tr>
  </thead>
  <tbody>
  {% for r in rows %}
    <tr>
      <td>{{ r.date }}</td>
      <td class="num">{{ "%.2f"|format(r.value) }} {{ r.currency }}</td>
      <td>{{ r.category }}</td>
      <td>{{ r.person }}</td>
      <td>{{ r.description }}</td>
    </tr>
  {% else %}
    <tr><td colspan="5">No transactions match.</td></tr>
  {% endfor %}
  </tbody>
</table>
