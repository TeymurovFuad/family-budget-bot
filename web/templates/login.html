<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget — Log in</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: Canvas;
         color: CanvasText; display: grid; place-items: center; min-height: 100vh; }
  form { display: grid; gap: .75rem; width: min(20rem, 90vw); }
  input, button { font: inherit; padding: .6rem; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Budget</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="password" name="password" placeholder="Password"
         autofocus autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
</body>
</html>
