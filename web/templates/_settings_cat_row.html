<li class="settings-list-item" data-category="{{ name }}">
  <span class="item-name">{{ name }}</span>
  <span class="cat-budget muted">
    {% if budget %}Budget: {{ budget | int }}{% else %}Budget: —{% endif %}
  </span>
  <button class="btn btn--ghost btn--sm"
          hx-get="/settings/categories/{{ name | urlencode }}/budget-form"
          hx-target="closest .settings-list-item"
          hx-swap="outerHTML">Edit budget</button>
  <button class="btn btn--ghost btn--sm"
          hx-get="/settings/categories/{{ name | urlencode }}/rename-form"
          hx-target="closest .settings-list-item"
          hx-swap="outerHTML">Rename</button>
</li>
