<li class="settings-list-item" data-category="{{ name }}">
  <form class="inline-form"
        hx-post="/settings/categories/{{ name | urlencode }}/budget"
        hx-target="#categories-section"
        hx-swap="outerHTML">
    <span class="item-name">{{ name }}</span>
    <input type="text" name="budget" value="{{ budget if budget else '' }}"
           maxlength="20" placeholder="e.g. 500" autofocus>
    <button type="submit" class="btn btn--primary btn--sm">Save</button>
    <a class="btn btn--ghost btn--sm"
       hx-get="/settings/categories/{{ name | urlencode }}/row"
       hx-target="closest .settings-list-item"
       hx-swap="outerHTML">Cancel</a>
  </form>
</li>
